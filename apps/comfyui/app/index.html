<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ComfyUI 设计器</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      #root {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div
        id="loading-label"
        style="
          display: flex;
          align-items: center;
          justify-content: center;
          width: 100%;
          height: 100%;
          color: #999;
          font-size: 14px;
        "
      >
        加载中…
      </div>
    </div>
    <script>
      (() => {
        let locale = "zh-CN";
        try {
          if (localStorage.getItem("flow-designer:locale") === "en-US") locale = "en-US";
        } catch {}
        document.documentElement.lang = locale;
        document.title = locale === "en-US" ? "ComfyUI Designer" : "ComfyUI 设计器";
        document.getElementById("loading-label").textContent =
          locale === "en-US" ? "Loading…" : "加载中…";
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
