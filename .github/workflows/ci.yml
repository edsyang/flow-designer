name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: Workspace verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Format check
        run: pnpm turbo run //#format:check

      - name: Build workspace dependencies
        run: pnpm build

      - name: Lint
        run: pnpm turbo run lint

      - name: Import boundaries
        run: pnpm check:boundaries

      - name: Typecheck and Test
        run: pnpm turbo run typecheck test

      - name: Built consumer contracts
        run: pnpm check:core-baseline

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser smoke
        run: pnpm exec playwright test --config=playwright.smoke.config.mjs

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics
          path: test-results/
          retention-days: 7